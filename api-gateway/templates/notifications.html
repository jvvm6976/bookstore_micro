<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thông báo - ShopSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>{% include "_customer_ui.css" %}</style>
</head>
<body>
{% include "_customer_header.html" %}

<main class="page">
  <section class="page-head">
    <div>
      <div class="eyebrow">Thông báo</div>
      <h1 class="page-title">Trung tâm thông báo</h1>
      <p class="page-subtitle">Thông báo được phân loại theo đơn hàng, thanh toán, vận chuyển, đánh giá và hệ thống. Nội dung nội bộ chỉ hiển thị với tài khoản vận hành.</p>
    </div>
    <button class="btn subtle" type="button" onclick="markAllRead()">Đánh dấu đã đọc</button>
  </section>

  <section class="filter-row" aria-label="Lọc thông báo">
    <button class="filter-chip active" type="button" onclick="filterNotif('all', this)">Tất cả</button>
    <button class="filter-chip" data-internal-filter type="button" onclick="filterNotif('internal', this)">Nội bộ</button>
    <button class="filter-chip" type="button" onclick="filterNotif('order', this)">Đơn hàng</button>
    <button class="filter-chip" type="button" onclick="filterNotif('shipping', this)">Vận chuyển</button>
    <button class="filter-chip" type="button" onclick="filterNotif('payment', this)">Thanh toán</button>
    <button class="filter-chip" type="button" onclick="filterNotif('review', this)">Đánh giá</button>
    <button class="filter-chip" type="button" onclick="filterNotif('system', this)">Hệ thống</button>
  </section>

  <section id="notifContainer">
    <div class="empty-state"><strong>Cần đăng nhập</strong>Vui lòng đăng nhập để xem thông báo.</div>
  </section>
</main>

<script>{% include "_customer_ui.js" %}</script>
<script>
const API_BASE = window.location.origin;
let token = localStorage.getItem('token');
let allNotifs = [];
let currentFilter = 'all';
const STAFF_ROLES = ['admin', 'manager', 'staff'];

const typeLabels = {
  order: 'Đơn hàng',
  shipping: 'Vận chuyển',
  payment: 'Thanh toán',
  review: 'Đánh giá',
  system: 'Hệ thống'
};

function isStaffRole() {
  return STAFF_ROLES.includes((ShopUI.role() || '').toLowerCase());
}

function isInternalNotif(notif) {
  return ['staff', 'admin', 'manager'].includes((notif.recipient_type || '').toLowerCase());
}

function recipientLabel(notif) {
  const type = (notif.recipient_type || '').toLowerCase();
  if (isInternalNotif(notif)) return 'Nội bộ';
  if (type === 'all') return 'Hệ thống chung';
  return 'Khách hàng';
}

function updateInternalFilter() {
  document.querySelectorAll('[data-internal-filter]').forEach(el => {
    el.style.display = isStaffRole() ? 'inline-flex' : 'none';
  });
}

async function loadNotifications() {
  token = localStorage.getItem('token');
  updateInternalFilter();
  if (!token) {
    document.getElementById('notifContainer').innerHTML = `
      <div class="empty-state">
        <strong>Cần đăng nhập</strong>
        <a class="btn primary" href="/login/?next=/notifications/" style="margin-top:.8rem">Đăng nhập</a>
      </div>
    `;
    return;
  }

  try {
    const data = await ShopUI.fetchJson(`${API_BASE}/api/notifications/`, {headers: ShopUI.authHeaders(false)});
    allNotifs = ShopUI.safeList(data);
    renderNotifications();
  } catch (err) {
    document.getElementById('notifContainer').innerHTML = '<div class="empty-state"><strong>Không tải được thông báo</strong>Vui lòng thử lại sau.</div>';
  }
}

function visibleByFilter(notif) {
  if (currentFilter === 'all') return true;
  if (currentFilter === 'internal') return isInternalNotif(notif);
  return String(notif.type || '').toLowerCase().includes(currentFilter);
}

function renderNotifications() {
  const filtered = allNotifs.filter(visibleByFilter);

  if (!filtered.length) {
    document.getElementById('notifContainer').innerHTML = '<div class="empty-state"><strong>Không có thông báo</strong>Không tìm thấy thông báo theo bộ lọc hiện tại.</div>';
    return;
  }

  document.getElementById('notifContainer').innerHTML = `
    <div class="notification-list">
      ${filtered.map(notif => {
        const isUnread = (notif.status || 'unread') === 'unread';
        const type = String(notif.type || 'system').toLowerCase();
        return `
          <article class="notification-card ${isUnread ? 'unread' : ''}">
            <div>
              <div class="notification-type">
                ${ShopUI.escapeHtml(typeLabels[type] || type)}
                <span class="recipient-pill">${recipientLabel(notif)}</span>
              </div>
              <div class="notification-title">${ShopUI.escapeHtml(notif.title || 'Thông báo')}</div>
              <div class="notification-msg">${ShopUI.escapeHtml(notif.content || '')}</div>
              <div class="notification-time">${new Date(notif.created_at || Date.now()).toLocaleString('vi-VN')}</div>
            </div>
            <div class="notification-actions">
              ${isUnread ? `<button class="btn primary small" onclick="markAsRead(${Number(notif.id)})">Đã xem</button>` : '<span class="status-pill read">Đã đọc</span>'}
            </div>
          </article>
        `;
      }).join('')}
    </div>
  `;
}

function filterNotif(type, el) {
  currentFilter = type;
  document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
  if (el) el.classList.add('active');
  renderNotifications();
}

async function markAsRead(notifId) {
  try {
    await ShopUI.fetchJson(`${API_BASE}/api/notifications/${notifId}/read/`, {
      method: 'PUT',
      headers: ShopUI.authHeaders(),
      body: '{}'
    });
    await loadNotifications();
  } catch (e) {
    ShopUI.toast(e.message || 'Không cập nhật được thông báo', 'err');
  }
}

async function markAllRead() {
  if (!ShopUI.token()) {
    ShopUI.toast('Vui lòng đăng nhập', 'err');
    return;
  }
  try {
    await ShopUI.fetchJson(`${API_BASE}/api/notifications/read-all/`, {
      method: 'PUT',
      headers: ShopUI.authHeaders(),
      body: '{}'
    });
    await loadNotifications();
  } catch (e) {
    ShopUI.toast(e.message || 'Không cập nhật được thông báo', 'err');
  }
}

loadNotifications();
</script>
</body>
</html>
