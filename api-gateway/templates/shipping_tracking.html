<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi vận chuyển - ShopSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>{% include "_customer_ui.css" %}</style>
</head>
<body>
{% include "_customer_header.html" with active_nav="orders" %}

<main class="page">
  <section class="page-head">
    <div>
      <div class="eyebrow">Vận chuyển</div>
      <h1 class="page-title">Theo dõi vận chuyển</h1>
      <p class="page-subtitle">Thông tin vận đơn, địa chỉ nhận hàng và các mốc giao hàng mới nhất.</p>
    </div>
    <a class="btn subtle" href="/orders/">Quay lại đơn hàng</a>
  </section>

  <section id="shippingContainer">
    <div class="empty-state"><strong>Đang tải vận đơn</strong>Vui lòng chờ trong giây lát.</div>
  </section>
</main>

<script>{% include "_customer_ui.js" %}</script>
<script>
const API_BASE = window.location.origin;
const params = new URLSearchParams(window.location.search);
const orderId = params.get('order_id') || window.location.pathname.split('/')[2];
let token = localStorage.getItem('token');

const statusLabels = {
  pending: 'Chờ xác nhận',
  paid: 'Đã xác nhận',
  processing: 'Đang chuẩn bị',
  shipping: 'Đang vận chuyển',
  delivered: 'Đã giao',
  cancelled: 'Đã hủy'
};

function statusClass(status) {
  return `status-pill ${String(status || 'processing').toLowerCase()}`;
}

async function loadShipping() {
  token = localStorage.getItem('token');
  if (!token || !orderId) {
    document.getElementById('shippingContainer').innerHTML = `
      <div class="empty-state">
        <strong>Cần đăng nhập</strong>
        <a class="btn primary" href="/login/?next=${encodeURIComponent(window.location.pathname)}" style="margin-top:.8rem">Đăng nhập</a>
      </div>
    `;
    return;
  }

  try {
    const shipment = await ShopUI.fetchJson(`${API_BASE}/api/shipping/${orderId}/`, {headers: ShopUI.authHeaders(false)});
    let updates = [];
    try {
      updates = ShopUI.safeList(await ShopUI.fetchJson(`${API_BASE}/api/shipping/tracking/${orderId}/`, {headers: ShopUI.authHeaders(false)}));
    } catch (_) {}

    const status = String(shipment.current_status || 'processing').toLowerCase();
    const latest = updates.length ? updates[0] : null;
    const location = latest?.location || 'Kho ShopSphere';

    document.getElementById('shippingContainer').innerHTML = `
      <div class="drawer-grid">
        <div>
          <article class="panel pad">
            <div class="order-top">
              <div>
                <div class="eyebrow">Đơn #${shipment.order_id}</div>
                <h2 class="section-title">Trạng thái vận chuyển</h2>
              </div>
              <span class="${statusClass(status)}">${ShopUI.escapeHtml(statusLabels[status] || status)}</span>
            </div>
            <div class="order-stats">
              <div class="data-tile">
                <div class="data-label">Vị trí hiện tại</div>
                <div class="data-value">${ShopUI.escapeHtml(location)}</div>
              </div>
              <div class="data-tile">
                <div class="data-label">Cập nhật gần nhất</div>
                <div class="data-value">${latest?.updated_at ? new Date(latest.updated_at).toLocaleString('vi-VN') : 'Chưa có cập nhật'}</div>
              </div>
              <div class="data-tile">
                <div class="data-label">Mã đơn</div>
                <div class="data-value">#${shipment.order_id}</div>
              </div>
            </div>
          </article>

          <article class="panel pad section">
            <h2 class="section-title">Chi tiết vận chuyển</h2>
            <div class="timeline" style="margin-top:1rem">
              ${updates.length ? updates.map(update => `
                <div class="timeline-item completed">
                  <div class="timeline-title">${ShopUI.escapeHtml(statusLabels[String(update.status || '').toLowerCase()] || update.status || 'Cập nhật')}</div>
                  <div class="timeline-time">${new Date(update.updated_at || Date.now()).toLocaleString('vi-VN')}</div>
                  <div class="tracking-details">
                    Vị trí: ${ShopUI.escapeHtml(update.location || 'Không xác định')}<br>
                    Trạng thái: ${ShopUI.escapeHtml(statusLabels[String(update.status || '').toLowerCase()] || update.status || '-')}
                  </div>
                </div>
              `).join('') : '<div class="empty-state"><strong>Chưa có cập nhật vị trí</strong></div>'}
            </div>
          </article>
        </div>

        <aside class="panel pad">
          <h2 class="section-title">Thông tin người nhận</h2>
          <div class="summary-row"><span>Họ tên</span><strong>${ShopUI.escapeHtml(shipment.receiver_name || '-')}</strong></div>
          <div class="summary-row"><span>Điện thoại</span><strong>${ShopUI.escapeHtml(shipment.phone || '-')}</strong></div>
          <div class="summary-row" style="align-items:flex-start"><span>Địa chỉ</span><strong>${ShopUI.escapeHtml(shipment.full_address || '-')}</strong></div>
          <div class="summary-row"><span>Trạng thái</span><strong>${ShopUI.escapeHtml(statusLabels[status] || status)}</strong></div>
        </aside>
      </div>
    `;
  } catch (err) {
    document.getElementById('shippingContainer').innerHTML = '<div class="empty-state"><strong>Không tải được vận chuyển</strong>Vận đơn không tồn tại hoặc bạn không có quyền xem.</div>';
  }
}

loadShipping();
</script>
</body>
</html>
