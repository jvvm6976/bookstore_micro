<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopSphere Compatibility Page</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--p:#C2182B;--pd:#8E1120;--bg:#FFF6F6;--s:#fff;--t:#2E1114;--tm:#7C3A42;--b:#F0C8CE;--r:12px}
body{font-family:Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{max-width:620px;width:100%;background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:1.2rem}
h1{font-size:1.05rem;color:var(--pd);margin-bottom:.6rem}
p{line-height:1.6;color:var(--tm);margin-bottom:.6rem}
.actions{display:flex;gap:.5rem;flex-wrap:wrap}
a{display:inline-block;background:var(--p);color:#fff;text-decoration:none;padding:.52rem .85rem;border-radius:8px;font-weight:700}
.secondary{background:#fff;color:var(--pd);border:1px solid var(--b)}
.small{margin-top:.7rem;font-size:.82rem;color:var(--tm)}
</style>
</head>
<body>
  <div class="card">
    <h1>Cart Legacy da duoc chuan hoa</h1>
    <p>Legacy template endpoints have been removed. This page is now a compatibility shell and uses only current frontend routes.</p>
    <p>You will be redirected to <strong>/cart/</strong> in 1.5 seconds.</p>
    <div class="actions">
      <a href="/cart/">Go now</a>
      <a class="secondary" href="/home/">Home</a>
    </div>
    <div class="small">No legacy API call is executed on this page.</div>
  </div>
<script>
setTimeout(function(){ window.location.replace('/cart/'); }, 1500);
</script>
</body>
</html>
