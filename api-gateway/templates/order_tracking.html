<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi đơn hàng - ShopSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
{% include "_shared_theme_tokens.css" %}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--t)}
nav{background:var(--s);padding:.7rem 2rem;box-shadow:var(--sh);display:grid;grid-template-columns:auto 1fr auto;gap:1rem;position:sticky;top:0;z-index:300}
.logo{font-size:1.35rem;font-weight:800;color:var(--pdd)}.logo em{color:var(--p)}
.main-wrap{max-width:900px;margin:0 auto;padding:2rem}
.title{font-size:1.3rem;font-weight:800;margin-bottom:1.5rem;display:flex;align-items:center;gap:.5rem}
.title::before{content:'';width:4px;height:1.3rem;background:var(--p)}
.card{background:var(--s);border:1.5px solid var(--b);border-radius:var(--r);padding:1.5rem;margin-bottom:1.5rem}
.order-header{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem}
.order-info{font-size:.9rem}
.order-info-label{font-weight:700;color:var(--pd)}.order-info-value{color:var(--t);margin-top:.2rem}
.timeline{position:relative;padding-left:2rem}
.timeline::before{content:'';position:absolute;left:.5rem;top:0;bottom:0;width:2px;background:var(--b)}
.timeline-item{position:relative;margin-bottom:1.5rem;padding-bottom:1rem}
.timeline-item::before{content:'';position:absolute;left:-1.95rem;top:.4rem;width:1.2rem;height:1.2rem;border-radius:50%;background:var(--b);border:3px solid var(--s)}
.timeline-item.completed::before{background:var(--p);border-color:var(--p)}
.timeline-item.current::before{background:var(--p);border-color:var(--s);box-shadow:0 0 0 2px var(--p)}
.timeline-title{font-weight:700;margin-bottom:.3rem}
.timeline-time{font-size:.8rem;color:var(--tm)}
.tracking-details{background:var(--pll);border-radius:var(--rs);padding:1rem;margin-top:1rem;font-size:.9rem}
.status-badge{display:inline-block;padding:.4rem .8rem;background:var(--p);color:#fff;border-radius:20px;font-weight:700;font-size:.8rem}
.btn{padding:.5rem 1rem;border-radius:var(--rs);border:none;font-weight:700;cursor:pointer;transition:all .2s}
.btn-p{background:var(--p);color:#fff}.btn-p:hover{background:var(--pd)}
.btn-ghost{background:transparent;border:1px solid var(--b);color:var(--t)}
footer{background:var(--pdd);color:#fff;padding:2rem;margin-top:2rem;text-align:center}
</style>
<style>{% include "_customer_header.css" %}</style>
</head>
<body>

{% include "_customer_header.html" with active_nav="orders" %}
<div class="main-wrap">
  <div class="title">📦 Theo dõi đơn hàng</div>
  
  <div id="trackingContainer">
    <div class="card">
      <div style="text-align:center;padding:2rem">
        <div style="font-size:2rem;margin-bottom:1rem">⏳</div>
        <p style="color:var(--tm)">Đang tải thông tin đơn hàng...</p>
      </div>
    </div>
  </div>
</div>

<footer>
  © 2026 ShopSphere | Theo dõi giao hàng trong thời gian thực
</footer>

<script>{% include "_customer_ui.js" %}</script>
<script>
const API_BASE = window.location.origin;
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('order_id') || window.location.pathname.split('/')[2];
let token = localStorage.getItem('token');

async function loadTracking() {
  if (!token || !orderId) {
    document.getElementById('trackingContainer').innerHTML = `
      <div class="card">
        <div style="text-align:center;color:var(--tm)">
          <div style="font-size:2rem;margin-bottom:1rem">🔒</div>
          <p>Vui lòng đăng nhập để xem thông tin tracking</p>
        </div>
      </div>
    `;
    return;
  }

  try {
    // Get order details
    const orderRes = await fetch(`${API_BASE}/api/orders/${orderId}/`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!orderRes.ok) throw new Error('order not found');
    const order = await orderRes.json();

    // Get shipment and tracking history
    const shipmentRes = await fetch(`${API_BASE}/api/shipping/${orderId}/`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const shipment = shipmentRes.ok ? await shipmentRes.json() : null;

    const trackRes = await fetch(`${API_BASE}/api/shipping/tracking/${orderId}/`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    const tracking = trackRes.ok ? await trackRes.json() : [];
    const updates = ShopUI.safeList(tracking);
    const shipmentStatus = shipment?.current_status || '';
    const currentStatus = order.current_status || shipmentStatus || 'pending';

    let html = `
      <div class="card">
        <div class="order-header">
          <div class="order-info">
            <div class="order-info-label">📦 Mã đơn hàng</div>
            <div class="order-info-value">#${order.id}</div>
          </div>
          <div class="order-info">
            <div class="order-info-label">🚚 Trạng thái</div>
            <div class="order-info-value"><span class="status-badge">${currentStatus}</span></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:1rem">Lịch sử vận chuyển</div>
        <div class="timeline">
    `;

    const statuses = ['pending', 'paid', 'processing', 'shipping', 'delivered', 'completed'];
    const statusLabels = {
      'pending': '⏳ Chờ xác nhận',
      'paid': '💳 Đã thanh toán',
      'processing': '📦 Đang chuẩn bị',
      'shipping': '🚚 Đang giao',
      'delivered': '✓✓ Đã giao',
      'completed': '✅ Hoàn tất'
    };

    statuses.forEach(status => {
      const update = updates.find(u => (u.status || '').toLowerCase() === status);
      const isCompleted = statuses.indexOf(status) < statuses.indexOf(currentStatus);
      const isCurrent = (currentStatus || '').toLowerCase() === status;

      html += `
        <div class="timeline-item ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}">
          <div class="timeline-title">${statusLabels[status] || status}</div>
          ${update ? `
            <div class="timeline-time">${new Date(update.updated_at).toLocaleString('vi-VN')}</div>
            <div class="tracking-details">
              📍 ${update.location || 'Không xác định'}<br>
              📝 ${update.status || '-'}
            </div>
          ` : ''}
        </div>
      `;
    });

    html += `
        </div>
      </div>

      <div class="card">
        <div style="font-weight:700;margin-bottom:1rem">Chi tiết đơn hàng</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;font-size:.9rem">
          <div>
            <div style="color:var(--pd);font-weight:700">Ngày đặt hàng</div>
            <div>${new Date(order.created_at).toLocaleString('vi-VN')}</div>
          </div>
          <div>
            <div style="color:var(--pd);font-weight:700">Tổng tiền</div>
            <div style="font-size:1.2rem;font-weight:800;color:var(--p)">${(order.total_price || 0).toLocaleString('vi-VN')}₫</div>
          </div>
          <div>
            <div style="color:var(--pd);font-weight:700">Người nhận</div>
            <div>${shipment?.receiver_name || order.address?.receiver_name || '-'}</div>
          </div>
          <div>
            <div style="color:var(--pd);font-weight:700">Địa chỉ giao hàng</div>
            <div>${shipment?.full_address || order.address?.full_address || '-'}</div>
          </div>
        </div>
      </div>
    `;

    document.getElementById('trackingContainer').innerHTML = html;
  } catch (err) {
    document.getElementById('trackingContainer').innerHTML = `
      <div class="card">
        <div style="text-align:center;color:var(--tm)">
          <div style="font-size:2rem;margin-bottom:1rem">⚠️</div>
          <p>Không tìm thấy đơn hàng</p>
        </div>
      </div>
    `;
  }
}

loadTracking();
</script>

</body>
</html>
