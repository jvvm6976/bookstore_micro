<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Theo dõi đơn hàng - ShopSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>{% include "_customer_ui.css" %}</style>
</head>
<body>
{% include "_customer_header.html" with active_nav="orders" %}

<main class="page">
  <section class="page-head">
    <div>
      <div class="eyebrow">Theo dõi đơn</div>
      <h1 class="page-title">Chi tiết đơn hàng</h1>
      <p class="page-subtitle">Theo dõi trạng thái đơn hàng, thanh toán và vận chuyển trong một màn hình.</p>
    </div>
    <a class="btn subtle" href="/orders/">Quay lại đơn hàng</a>
  </section>

  <section id="trackingContainer">
    <div class="empty-state"><strong>Đang tải đơn hàng</strong>Vui lòng chờ trong giây lát.</div>
  </section>
</main>

<script>{% include "_customer_ui.js" %}</script>
<script>
const API_BASE = window.location.origin;
const urlParams = new URLSearchParams(window.location.search);
const orderId = urlParams.get('order_id') || window.location.pathname.split('/')[2];
let token = localStorage.getItem('token');

const statusLabels = {
  pending: 'Chờ xác nhận',
  paid: 'Đã xác nhận',
  processing: 'Đang chuẩn bị',
  shipping: 'Đang giao',
  delivered: 'Đã giao',
  completed: 'Hoàn tất',
  cancelled: 'Đã hủy',
  failed: 'Thất bại'
};

const paymentMethodLabels = {
  cod: 'Thanh toán khi nhận hàng',
  vnpay: 'VNPAY',
  momo: 'MoMo',
  stripe: 'Thẻ quốc tế'
};

const paymentStatusLabels = {
  pending: 'Chờ thanh toán',
  success: 'Đã thanh toán',
  failed: 'Thanh toán thất bại',
  refunded: 'Đã hoàn tiền'
};

function paymentMethodLabel(value) {
  return paymentMethodLabels[String(value || '').toLowerCase()] || value || '-';
}

function paymentStatusLabel(value, method) {
  const normalizedMethod = String(method || '').toLowerCase();
  const normalizedStatus = String(value || '').toLowerCase();
  if (normalizedMethod === 'cod' && normalizedStatus === 'pending') {
    return 'Chưa thu tiền';
  }
  return paymentStatusLabels[normalizedStatus] || value || '-';
}

function paymentTransactionNote(note = '') {
  const text = String(note || '');
  const method = text.match(/^Payment via\s+(.+)$/i);
  if (method) return `Thanh toán qua ${paymentMethodLabel(method[1])}`;
  const refund = text.match(/^Refund:\s*(.+)$/i);
  if (refund) return `Hoàn tiền: ${refund[1]}`;
  return text || '-';
}

function statusClass(status) {
  return `status-pill ${String(status || 'pending').toLowerCase()}`;
}

async function loadTracking() {
  token = localStorage.getItem('token');
  if (!token || !orderId) {
    document.getElementById('trackingContainer').innerHTML = `
      <div class="empty-state">
        <strong>Cần đăng nhập</strong>
        <a class="btn primary" href="/login/?next=${encodeURIComponent(window.location.pathname)}" style="margin-top:.8rem">Đăng nhập</a>
      </div>
    `;
    return;
  }

  try {
    const order = await ShopUI.fetchJson(`${API_BASE}/api/orders/${orderId}/`, {headers: ShopUI.authHeaders(false)});

    let shipment = null;
    let updates = [];
    let payment = null;
    let paymentTransactions = [];
    try { shipment = await ShopUI.fetchJson(`${API_BASE}/api/shipping/${orderId}/`, {headers: ShopUI.authHeaders(false)}); } catch (_) {}
    try { updates = ShopUI.safeList(await ShopUI.fetchJson(`${API_BASE}/api/shipping/tracking/${orderId}/`, {headers: ShopUI.authHeaders(false)})); } catch (_) {}
    try { payment = await ShopUI.fetchJson(`${API_BASE}/api/payments/${orderId}/`, {headers: ShopUI.authHeaders(false)}); } catch (_) {}
    try { paymentTransactions = ShopUI.safeList(await ShopUI.fetchJson(`${API_BASE}/api/payments/${orderId}/transactions/`, {headers: ShopUI.authHeaders(false)})); } catch (_) {}

    const shipmentStatus = shipment?.current_status || '';
    const currentStatus = String(order.current_status || shipmentStatus || 'pending').toLowerCase();
    const canCancel = ['pending', 'paid'].includes(currentStatus);

    document.getElementById('trackingContainer').innerHTML = `
      <div class="drawer-grid">
        <div>
          <article class="panel pad">
            <div class="order-top">
              <div>
                <div class="eyebrow">Đơn #${order.id}</div>
                <h2 class="section-title">Trạng thái đơn hàng</h2>
              </div>
              <span class="${statusClass(currentStatus)}">${ShopUI.escapeHtml(statusLabels[currentStatus] || currentStatus)}</span>
            </div>
            <div class="order-stats">
              <div class="data-tile">
                <div class="data-label">Ngày đặt</div>
                <div class="data-value">${new Date(order.created_at || Date.now()).toLocaleString('vi-VN')}</div>
              </div>
              <div class="data-tile">
                <div class="data-label">Tổng tiền</div>
                <div class="data-value price">${ShopUI.money(order.total_price || 0)}</div>
              </div>
              <div class="data-tile">
                <div class="data-label">Số sản phẩm</div>
                <div class="data-value">${Array.isArray(order.items) ? order.items.reduce((s,i)=>s+Number(i.quantity||0),0) : 0}</div>
              </div>
            </div>
            <div class="order-actions">
              <a class="btn small" href="/shipping/${order.id}/tracking/">Xem vận chuyển</a>
              ${canCancel ? `<button class="btn small" onclick="cancelOrder(${Number(order.id)})">Hủy đơn</button>` : ''}
            </div>
          </article>

          <article class="panel pad section">
            <h2 class="section-title">Lịch sử vận chuyển</h2>
            <div class="timeline" style="margin-top:1rem">${renderTimeline(currentStatus, updates)}</div>
          </article>
        </div>

        <aside>
          <article class="panel pad">
            <h2 class="section-title">Người nhận</h2>
            <div class="summary-row"><span>Họ tên</span><strong>${ShopUI.escapeHtml(shipment?.receiver_name || order.address?.receiver_name || '-')}</strong></div>
            <div class="summary-row"><span>Điện thoại</span><strong>${ShopUI.escapeHtml(shipment?.phone || order.address?.phone || '-')}</strong></div>
            <div class="summary-row" style="align-items:flex-start"><span>Địa chỉ</span><strong>${ShopUI.escapeHtml(shipment?.full_address || order.address?.full_address || '-')}</strong></div>
          </article>

          <article class="panel pad section">
            <h2 class="section-title">Thanh toán</h2>
            ${payment ? `
              <div class="summary-row"><span>Phương thức</span><strong>${ShopUI.escapeHtml(paymentMethodLabel(payment.payment_method))}</strong></div>
              <div class="summary-row"><span>Trạng thái</span><strong>${ShopUI.escapeHtml(paymentStatusLabel(payment.overall_status, payment.payment_method))}</strong></div>
              <div class="summary-row"><span>Số tiền</span><strong class="price">${ShopUI.money(payment.amount || 0)}</strong></div>
              <div class="section-note" style="margin-top:.8rem">Giao dịch</div>
              ${paymentTransactions.length ? paymentTransactions.map(tx => `
                <div class="tracking-details">
                  ${ShopUI.escapeHtml(paymentTransactionNote(tx.transaction_note))}<br>
                  <span>${ShopUI.escapeHtml(tx.transaction_code || '')} ${tx.created_at ? '- ' + new Date(tx.created_at).toLocaleString('vi-VN') : ''}</span>
                </div>
              `).join('') : '<div class="tracking-details">Chưa có lịch sử giao dịch.</div>'}
            ` : '<div class="tracking-details">Chưa có bản ghi thanh toán cho đơn này.</div>'}
          </article>
        </aside>
      </div>
    `;
  } catch (err) {
    document.getElementById('trackingContainer').innerHTML = '<div class="empty-state"><strong>Không tìm thấy đơn hàng</strong>Kiểm tra lại mã đơn hoặc quyền truy cập.</div>';
  }
}

function renderTimeline(currentStatus, updates) {
  const statuses = ['pending', 'paid', 'processing', 'shipping', 'delivered', 'completed'];
  const currentIndex = statuses.indexOf(currentStatus);
  return statuses.map(status => {
    const update = updates.find(u => String(u.status || '').toLowerCase() === status);
    const isCompleted = currentIndex >= 0 && statuses.indexOf(status) < currentIndex;
    const isCurrent = currentStatus === status;
    return `
      <div class="timeline-item ${isCompleted ? 'completed' : ''} ${isCurrent ? 'current' : ''}">
        <div class="timeline-title">${statusLabels[status] || status}</div>
        ${update ? `
          <div class="timeline-time">${new Date(update.updated_at || Date.now()).toLocaleString('vi-VN')}</div>
          <div class="tracking-details">
            Vị trí: ${ShopUI.escapeHtml(update.location || 'Không xác định')}<br>
            Trạng thái: ${ShopUI.escapeHtml(statusLabels[String(update.status || '').toLowerCase()] || update.status || '-')}
          </div>
        ` : ''}
      </div>
    `;
  }).join('');
}

async function cancelOrder(orderId) {
  if (!confirm(`Hủy đơn #${orderId}?`)) return;
  try {
    await ShopUI.fetchJson(`${API_BASE}/api/orders/${orderId}/cancel/`, {
      method: 'PUT',
      headers: ShopUI.authHeaders(),
      body: JSON.stringify({})
    });
    ShopUI.toast('Đã hủy đơn hàng');
    await loadTracking();
  } catch (err) {
    ShopUI.toast(err.message || 'Không hủy được đơn hàng', 'err');
  }
}

loadTracking();
</script>
</body>
</html>
