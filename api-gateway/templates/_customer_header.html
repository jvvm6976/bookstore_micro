<header class="shell-nav">
  <div class="nav-inner">
    <a class="brand" href="/" aria-label="ShopSphere">
      <span class="brand-mark">S</span>
      <span>Shop<em>Sphere</em></span>
    </a>

    <div class="nav-search">
      <input id="globalSearch" placeholder="Tìm sản phẩm, danh mục hoặc thương hiệu">
      <button type="button" data-header-search-button>Tìm</button>
    </div>

    <div class="nav-links" aria-label="Điều hướng chính">
      <a class="nav-link {% if active_nav == 'products' %}active{% endif %}" href="/products/">Sản phẩm</a>
      <a class="nav-link {% if active_nav == 'wishlist' %}active{% endif %}" href="/wishlist/">Yêu thích</a>
      <a class="nav-link {% if active_nav == 'cart' %}active{% endif %}" href="/cart/">Giỏ hàng</a>
      <a class="nav-link {% if active_nav == 'orders' %}active{% endif %}" href="/orders/">Đơn hàng</a>
      <a class="nav-link {% if active_nav == 'ai' %}active{% endif %}" href="/chatbot/">AI</a>
      <div class="notification-widget" data-auth-only data-notification-widget>
        <button class="icon-btn notification-trigger" type="button" title="Thông báo" aria-label="Thông báo" aria-expanded="false" onclick="ShopUI.toggleNotifications(event)">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="notification-icon">
            <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
          </svg>
          <span class="notification-badge" data-notification-badge hidden>0</span>
        </button>
        <div class="notification-dropdown" data-notification-menu aria-hidden="true">
          <div class="notification-dropdown-head">
            <div>
              <strong>Thông báo</strong>
              <span data-notification-summary>Đang tải</span>
            </div>
            <button class="btn small" type="button" onclick="ShopUI.refreshNotifications(event)">Tải lại</button>
          </div>
          <div class="notification-dropdown-list" data-notification-list>
            <div class="notification-empty">Đang tải thông báo...</div>
          </div>
          <div class="notification-dropdown-foot">
            <button class="btn small" type="button" onclick="ShopUI.markAllNotificationsRead(event)">Đánh dấu đã đọc</button>
            <a class="btn primary small" href="/notifications/">Xem tất cả</a>
          </div>
        </div>
      </div>
      <a class="nav-action" data-guest-only href="/login/">Đăng nhập</a>
      <a class="nav-action subtle" data-auth-only href="/profile/">Hồ sơ</a>
      <button class="nav-action" type="button" data-auth-only onclick="ShopUI.logout()">Đăng xuất</button>
    </div>
  </div>
</header>
