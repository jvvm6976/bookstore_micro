{% extends "_portal_base.html" %}
{% block portal_content %}
<section class="portal-split">
  <div class="portal-panel portal-panel-pad">
    <div class="portal-section-head"><div><h2>Phân tích khách hàng</h2><p>Xem phân khúc và sản phẩm gợi ý theo lịch sử hành vi.</p></div></div>
    <div class="portal-toolbar" style="padding:0 0 14px;border:0"><label class="portal-field"><span>Mã khách hàng</span><input id="aiCustomerId" class="portal-input" type="number" min="1" placeholder="Ví dụ: 25"></label><button class="portal-btn primary" onclick="Portal.analyzeCustomer()"><i data-lucide="sparkles"></i>Phân tích</button></div>
    <div id="aiCustomerResult">{% include "_portal_empty_ai.html" %}</div>
  </div>
  <div class="portal-panel portal-panel-pad">
    <div class="portal-section-head"><div><h2>Cơ sở tri thức</h2><p>Trạng thái dữ liệu dùng cho chatbot và gợi ý.</p></div><button class="portal-btn" onclick="Portal.reindexKnowledge()"><i data-lucide="database-zap"></i>Cập nhật tri thức AI</button></div>
    <div id="aiStatusPanel"></div>
  </div>
</section>
{% endblock %}
