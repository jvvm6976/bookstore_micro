<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đơn hàng của tôi - ShopSphere</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>{% include "_customer_ui.css" %}</style>
</head>
<body>
{% include "_customer_header.html" with active_nav="orders" %}

<main class="page">
  <section class="page-head">
    <div>
      <div class="eyebrow">Đơn hàng</div>
      <h1 class="page-title">Đơn hàng của tôi</h1>
      <p class="page-subtitle">Theo dõi trạng thái xử lý, thanh toán, vận chuyển và mở đánh giá cho các đơn đủ điều kiện.</p>
    </div>
    <a class="btn subtle" href="/products/">Tiếp tục mua sắm</a>
  </section>

  <section class="filter-row" aria-label="Lọc đơn hàng">
    <button class="filter-chip active" type="button" onclick="filterOrders('all', this)">Tất cả</button>
    <button class="filter-chip" type="button" onclick="filterOrders('pending', this)">Chờ xử lý</button>
    <button class="filter-chip" type="button" onclick="filterOrders('paid', this)">Đã xác nhận</button>
    <button class="filter-chip" type="button" onclick="filterOrders('shipping', this)">Đang giao</button>
    <button class="filter-chip" type="button" onclick="filterOrders('completed', this)">Hoàn tất</button>
    <button class="filter-chip" type="button" onclick="filterOrders('cancelled', this)">Đã hủy</button>
  </section>

  <section class="record-list" id="ordersList">
    <div class="empty-state"><strong>Cần đăng nhập</strong>Vui lòng đăng nhập để xem đơn hàng.</div>
  </section>
</main>

<script>{% include "_customer_ui.js" %}</script>
<script>
const API_BASE = window.location.origin;
let token = localStorage.getItem('token');
let allOrders = [];
let currentFilter = 'all';

const statusLabels = {
  pending: 'Chờ xác nhận',
  paid: 'Đã xác nhận',
  processing: 'Đang chuẩn bị',
  shipping: 'Đang giao',
  shipped: 'Đã gửi',
  delivered: 'Đã giao',
  completed: 'Hoàn tất',
  cancelled: 'Đã hủy',
  failed: 'Thất bại'
};

function statusClass(status){
  return `status-pill ${String(status || 'pending').toLowerCase()}`;
}

async function loadOrders() {
  token = localStorage.getItem('token');
  if (!token) {
    document.getElementById('ordersList').innerHTML = `
      <div class="empty-state">
        <strong>Cần đăng nhập</strong>
        <a class="btn primary" href="/login/?next=/orders/" style="margin-top:.8rem">Đăng nhập</a>
      </div>
    `;
    return;
  }

  try {
    const data = await ShopUI.fetchJson(`${API_BASE}/api/orders/`, {headers: ShopUI.authHeaders(false)});
    const rows = ShopUI.safeList(data);
    allOrders = rows.sort((a, b) => new Date(b.created_at || 0) - new Date(a.created_at || 0));
    renderOrders();
  } catch (err) {
    document.getElementById('ordersList').innerHTML = '<div class="empty-state"><strong>Không tải được đơn hàng</strong>Vui lòng thử lại sau.</div>';
  }
}

function renderOrders() {
  let filtered = allOrders;
  if (currentFilter !== 'all') {
    filtered = allOrders.filter(o => String(o.current_status || o.status || '').toLowerCase() === currentFilter);
  }

  if (!filtered.length) {
    document.getElementById('ordersList').innerHTML = '<div class="empty-state"><strong>Không có đơn hàng</strong>Không tìm thấy đơn phù hợp với bộ lọc hiện tại.</div>';
    return;
  }

  document.getElementById('ordersList').innerHTML = filtered.map(order => {
    const status = String(order.current_status || order.status || 'pending').toLowerCase();
    const itemCount = Array.isArray(order.items) ? order.items.reduce((sum, item) => sum + Number(item.quantity || 0), 0) : (order.items_count || order.item_count || 0);
    const fullAddress = order.address?.full_address || order.shipping_address || 'Chưa xác định';
    const canReview = ['delivered', 'completed'].includes(status);
    const canCancel = ['pending', 'paid'].includes(status);
    return `
      <article class="order-card" onclick="window.location='/orders/${order.id}/tracking/'">
        <div class="order-top">
          <div>
            <div class="product-title">Đơn hàng #${order.id}</div>
            <div class="section-note">${new Date(order.created_at || Date.now()).toLocaleString('vi-VN')}</div>
          </div>
          <span class="${statusClass(status)}">${ShopUI.escapeHtml(statusLabels[status] || status)}</span>
        </div>
        <div class="order-stats">
          <div class="data-tile">
            <div class="data-label">Tổng tiền</div>
            <div class="data-value price">${ShopUI.money(order.total_price || 0)}</div>
          </div>
          <div class="data-tile">
            <div class="data-label">Số lượng</div>
            <div class="data-value">${itemCount} sản phẩm</div>
          </div>
          <div class="data-tile">
            <div class="data-label">Địa chỉ</div>
            <div class="data-value">${ShopUI.escapeHtml(fullAddress)}</div>
          </div>
        </div>
        <div class="order-actions">
          <button class="btn primary small" onclick="event.stopPropagation(); window.location='/orders/${order.id}/tracking/'">Chi tiết</button>
          <button class="btn small" onclick="event.stopPropagation(); window.location='/shipping/${order.id}/tracking/'">Vận chuyển</button>
          ${canReview ? `<button class="btn small" onclick="event.stopPropagation(); window.location='/reviews/?order_id=${order.id}'">Đánh giá</button>` : ''}
          ${canCancel ? `<button class="btn small" onclick="event.stopPropagation(); cancelOrder(${order.id})">Hủy đơn</button>` : ''}
        </div>
      </article>
    `;
  }).join('');
}

async function cancelOrder(orderId) {
  if (!confirm(`Hủy đơn #${orderId}?`)) return;
  try {
    await ShopUI.fetchJson(`${API_BASE}/api/orders/${orderId}/cancel/`, {
      method: 'PUT',
      headers: ShopUI.authHeaders(),
      body: JSON.stringify({})
    });
    ShopUI.toast('Đã hủy đơn hàng');
    await loadOrders();
  } catch (err) {
    ShopUI.toast(err.message || 'Không hủy được đơn hàng', 'err');
  }
}

function filterOrders(status, el) {
  currentFilter = status;
  document.querySelectorAll('.filter-chip').forEach(btn => btn.classList.remove('active'));
  if (el) el.classList.add('active');
  renderOrders();
}

loadOrders();
</script>
</body>
</html>
