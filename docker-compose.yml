services:
  # ═══════════════════════════════════════════════════════════
  # DATABASES
  # ═══════════════════════════════════════════════════════════
  db-mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ecommerce_db
    volumes:
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ecommerce_db
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ═══════════════════════════════════════════════════════════
  # MESSAGE BROKER
  # ═══════════════════════════════════════════════════════════
  rabbitmq:
    image: rabbitmq:3.12-management
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 10

  neo4j:
    image: neo4j:5.20
    restart: always
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/ecommerceneo4j
      NEO4J_server_memory_pagecache_size: 256M
      NEO4J_server_memory_heap_initial__size: 256M
      NEO4J_server_memory_heap_max__size: 512M
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ecommerce-network
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p ecommerceneo4j 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ═══════════════════════════════════════════════════════════
  # MICROSERVICES
  # ═══════════════════════════════════════════════════════════
  user-service:
    build: ./user-service
    image: ecommerce/user-service:latest
    ports:
      - "8001:8000"
    depends_on:
      db-mysql:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=user_service_config.settings
      - DB_NAME=ecommerce_user
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db-mysql
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024
      - JWT_ACCESS_MINUTES=60
      - JWT_REFRESH_DAYS=7

  product-service:
    build: ./product-service
    image: ecommerce/product-service:latest
    ports:
      - "8002:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=config.settings.dev
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=ecommerce_product
      - DB_USER=postgres
      - DB_PASSWORD=root
      - DB_HOST=db-postgres
      - DB_PORT=5432
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  cart-service:
    build: ./cart-service
    image: ecommerce/cart-service:latest
    ports:
      - "8003:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=cart_service.settings
      - POSTGRES_DB=ecommerce_cart
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - DB_HOST=db-postgres
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  order-service:
    build: ./order-service
    image: ecommerce/order-service:latest
    ports:
      - "8004:8000"
    depends_on:
      db-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=order_service.settings
      - DB_NAME=ecommerce_order
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db-mysql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  payment-service:
    build: ./payment-service
    image: ecommerce/payment-service:latest
    ports:
      - "8005:8000"
    depends_on:
      db-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=pay_service.settings
      - DB_NAME=ecommerce_pay
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db-mysql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  shipping-service:
    build: ./shipping-service
    image: ecommerce/shipping-service:latest
    ports:
      - "8006:8000"
    depends_on:
      db-mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=ship_service.settings
      - DB_NAME=ecommerce_ship
      - DB_USER=root
      - DB_PASSWORD=root
      - DB_HOST=db-mysql
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  comment-rate-service:
    build: ./comment-rate-service
    image: ecommerce/comment-rate-service:latest
    ports:
      - "8007:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=comment_rate_service.settings
      - POSTGRES_DB=ecommerce_comment
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - DB_HOST=db-postgres
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  notification-service:
    build: ./notification-service
    image: ecommerce/notification-service:latest
    ports:
      - "8008:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=notification_service_config.settings
      - POSTGRES_DB=ecommerce_notification
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - DB_HOST=db-postgres
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024

  ai-service:
    build: ./ai-service
    image: ecommerce/ai-service:latest
    ports:
      - "8009:8000"
    depends_on:
      db-postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - ecommerce-network
    volumes:
      - ai_artifacts:/app/artifacts
    environment:
      - DEBUG=1
      - POSTGRES_DB=ecommerce_recommender
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - DB_HOST=db-postgres
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - USER_SERVICE_URL=http://user-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - COMMENT_SERVICE_URL=http://comment-rate-service:8000
      - SHIPPING_SERVICE_URL=http://shipping-service:8000
      - PAYMENT_SERVICE_URL=http://payment-service:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=ecommerceneo4j

  # ═══════════════════════════════════════════════════════════
  # API GATEWAY (Django)
  # ═══════════════════════════════════════════════════════════
  api-gateway:
    build: ./api-gateway
    image: ecommerce/api-gateway:latest
    ports:
      - "8000:8000"
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - shipping-service
      - comment-rate-service
      - notification-service
      - ai-service
    networks:
      - ecommerce-network
    environment:
      - DEBUG=1
      - DJANGO_SETTINGS_MODULE=api_gateway.settings
      - JWT_SECRET=super-secret-jwt-key-change-in-production-2024
      - USER_SERVICE_URL=http://user-service:8000
      - PRODUCT_SERVICE_URL=http://product-service:8000
      - CART_SERVICE_URL=http://cart-service:8000
      - ORDER_SERVICE_URL=http://order-service:8000
      - PAYMENT_SERVICE_URL=http://payment-service:8000
      - SHIPPING_SERVICE_URL=http://shipping-service:8000
      - COMMENT_SERVICE_URL=http://comment-rate-service:8000
      - NOTIFICATION_SERVICE_URL=http://notification-service:8000
      - AI_SERVICE_URL=http://ai-service:8000

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mysql_data:
  postgres_data:
  rabbitmq_data:
  ai_artifacts:
  neo4j_data:
  neo4j_logs:
